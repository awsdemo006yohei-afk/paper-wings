<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Paper Wings — fold, fly, survive</title>
  <meta name="description" content="A one-button paper-rocket flyer. Every day brings a new sky. Free, no install, runs in your browser." />
  <link rel="stylesheet" href="css/style.css?v=19" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9657119821733951" crossorigin="anonymous"></script>
</head>
<body>
  <div id="gl"></div>

  <div id="hud">
    <div id="score">0</div>
  </div>
  <button id="autoPilot" type="button" title="toggle autopilot (Z)" hidden>autopilot — z</button>
  <div id="flash"></div>

  <div id="start" class="panel" hidden>
    <h1>Paper <span>Wings</span></h1>
    <p class="tag">hold to rise · release to dive · steer with your pointer</p>
    <button id="go" class="primary">Take flight</button>
    <div id="hangar" aria-label="choose your craft">
      <button id="craftPrev" aria-label="previous craft">◀</button>
      <span id="craftName">Paper Plane</span>
      <button id="craftNext" aria-label="next craft">▶</button>
    </div>
    <p class="hint">every day has its own sky — today's is <b id="themeNameSlot">loading…</b></p>
  </div>

  <div id="over" class="panel" hidden>
    <h2 id="overTitle">folded.</h2>
    <div id="finalScore" class="big">0</div>
    <p id="finalDetail" class="tag"></p>
    <p id="best" class="hint"></p>
    <div class="row">
      <button id="flyWith" class="primary">Fly with …</button>
    </div>
    <div class="row">
      <button id="share">Share score</button>
      <button id="seeCrash">See crash</button>
    </div>
    <!-- interstitial slot shown between runs -->
    <div id="interstitialAd" class="adslot tall" aria-hidden="true"></div>
  </div>

  <script type="module" src="js/main.js?v=33"></script>
</body>
</html>
